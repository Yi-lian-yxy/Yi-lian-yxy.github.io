<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>易礼安 · 个人主页</title>
  <meta name="description" content="易礼安的个人网站">
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --text: #1a1a1a;
      --text-secondary: #555555;
      --accent: #2563eb;
      --border: #e5e5e5;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }
    .container { max-width: 720px; margin: 0 auto; padding: 0 24px; }
    header { padding: 96px 0 48px; }
    .avatar {
      width: 96px; height: 96px; border-radius: 50%;
      background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; font-weight: 600; margin-bottom: 24px;
    }
    h1 { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; }
    .tagline { font-size: 18px; color: var(--text-secondary); margin-top: 8px; }
    section { padding: 32px 0; border-top: 1px solid var(--border); }
    h2 { font-size: 20px; font-weight: 600; margin-bottom: 16px; }
    p { color: var(--text-secondary); }
    .links { display: flex; gap: 16px; margin-top: 24px; flex-wrap: wrap; }
    .links a {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px; border-radius: 8px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); text-decoration: none; font-size: 15px;
      transition: all 0.2s ease;
    }
    .links a:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }
    footer { padding: 48px 0; color: #999; font-size: 14px; text-align: center; }
    footer a { color: #999; }
    @media (max-width: 480px) {
      header { padding: 64px 0 32px; }
      h1 { font-size: 32px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="avatar">易</div>
      <h1>易礼安</h1>
      <p class="tagline">你劳nb！culr nb！</p>
      <div class="links">
        <a href="https://github.com/Yi-lian-yxy" target="_blank" rel="noopener">GitHub</a>
      </div>
    </header>

    <section>
      <h2>关于我</h2>
      <p>yx媛nb</p>
    </section>

    <section>
      <h2>项目</h2>
      <p>Financial Book — 每天一本，bro.</p>
    </section>

    <footer>
      © 2026 易礼安 · <a href="https://github.com/Yi-lian-yxy/Yi-lian-yxy.github.io">本站源码</a>
    </footer>
  </div>
</body>
</html>
