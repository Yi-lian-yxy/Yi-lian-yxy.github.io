<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>易礼安 · 个人主页</title>
  <meta name="description" content="易礼安的个人网站">
  <style>
    :root {
      --text: #1a1a1a;
      --text-secondary: #444444;
      --text-muted: #777777;
      --accent: #2563eb;
      --card-bg: rgba(255, 255, 255, 0.86);
      --border: rgba(0, 0, 0, 0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
      background-image: url("bg.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    .layout {
      max-width: 1280px;
      margin: 0 auto;
      padding: 40px 24px;
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }
    .col { border-radius: 16px; }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
    }
    /* 左栏 50% */
    .col-left { flex: 2; min-width: 0; }
    .col-left .card + .card { margin-top: 24px; }
    .avatar {
      width: 88px; height: 88px; border-radius: 50%;
      background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 34px; font-weight: 600; margin-bottom: 20px;
    }
    h1 { font-size: 36px; font-weight: 700; letter-spacing: -0.02em; }
    .tagline { font-size: 17px; color: var(--text-secondary); margin-top: 6px; }
    .links { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
    .links a {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 9px 18px; border-radius: 8px;
      background: rgba(255, 255, 255, 0.9); border: 1px solid var(--border);
      color: var(--text); text-decoration: none; font-size: 15px;
      transition: all 0.2s ease;
    }
    .links a:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }
    h2 { font-size: 19px; font-weight: 600; margin-bottom: 12px; }
    .card p { color: var(--text-secondary); }
    /* 右侧两栏 各25% */
    .col-right { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 24px; }
    .col-right h2 { margin-bottom: 16px; }
    .photo-item {
      width: 100%;
      border-radius: 10px;
      display: block;
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }
    .photo-item:last-child { margin-bottom: 0; }
    .placeholder {
      border: 1.5px dashed rgba(0, 0, 0, 0.2);
      border-radius: 10px;
      padding: 26px 12px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }
    .member {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .member:last-of-type { border-bottom: none; }
    .member-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 600; flex-shrink: 0;
    }
    .member img.member-avatar { object-fit: cover; }
    .member-info { min-width: 0; }
    .member-name { font-size: 15px; font-weight: 500; color: var(--text); }
    .member-desc { font-size: 13px; color: var(--text-muted); }
    .member a { color: var(--accent); text-decoration: none; font-size: 13px; }
    .hint { font-size: 12px; color: var(--text-muted); margin-top: 14px; }
    footer {
      text-align: center; padding: 24px 0 40px;
      color: rgba(255, 255, 255, 0.95);
      font-size: 14px;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.45);
    }
    footer a { color: #fff; }
    @media (max-width: 900px) {
      .layout { flex-direction: column; }
      .col-left, .col-right { width: 100%; }
      h1 { font-size: 30px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <!-- 左栏 50%：原有内容 -->
    <div class="col col-left">
      <div class="card">
        <div class="avatar">易</div>
        <h1>易礼安</h1>
        <p class="tagline">你劳nb！culr nb！</p>
        <div class="links">
          <a href="https://github.com/Yi-lian-yxy" target="_blank" rel="noopener">GitHub</a>
        </div>
      </div>
      <div class="card">
        <h2>关于我</h2>
        <p>yx媛nb</p>
      </div>
      <div class="card">
        <h2>项目</h2>
        <p>Financial Book — 每天一本，bro.</p>
      </div>
    </div>

    <!-- 右栏 1：photo -->
    <div class="col col-right">
      <div class="card">
        <h2>photo</h2>
        <!-- 加图方法：把图片直接上传到仓库根目录，然后在这里插入
             <img class="photo-item" src="你的图片名.jpg" alt=""> -->
        <div class="placeholder">图片待添加</div>
        <div class="placeholder">图片待添加</div>
        <p class="hint">把图片发我或上传到仓库 images/ 目录即可填充这里</p>
      </div>

      <!-- 右栏 2：智囊团 -->
      <div class="card">
        <h2>智囊团</h2>
        <!-- 加成员方法：复制下面一段 member，改名字和描述 -->
        <div class="member">
          <div class="member-avatar">A</div>
          <div class="member-info">
            <p class="member-name">成员 A</p>
            <p class="member-desc">一句话介绍</p>
          </div>
        </div>
        <div class="member">
          <div class="member-avatar">B</div>
          <div class="member-info">
            <p class="member-name">成员 B</p>
            <p class="member-desc">一句话介绍</p>
          </div>
        </div>
        <p class="hint">告诉我成员名字/文件，我来帮你填充</p>
      </div>
    </div>
  </div>
  <footer>© 2026 易礼安</footer>
</body>
</html>
