<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>易礼安 · 个人主页</title>
  <meta name="description" content="易礼安的个人网站">
  <style>
    :root {
      --text: #1a1a1a;
      --text-secondary: #444444;
      --text-muted: #777777;
      --accent: #2563eb;
      --card-bg: rgba(255, 255, 255, 0.86);
      --border: rgba(0, 0, 0, 0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
      background-image: url("bg.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    .layout {
      max-width: 1280px;
      margin: 0 auto;
      padding: 40px 24px;
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }
    .col { border-radius: 16px; }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
    }
    /* 左栏 50% */
    .col-left { flex: 2; min-width: 0; }
    .col-left .card + .card { margin-top: 24px; }
    .avatar {
      width: 88px; height: 88px; border-radius: 50%;
      background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 34px; font-weight: 600; margin-bottom: 20px;
    }
    h1 { font-size: 36px; font-weight: 700; letter-spacing: -0.02em; }
    .tagline { font-size: 17px; color: var(--text-secondary); margin-top: 6px; }
    .links { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
    .links a {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 9px 18px; border-radius: 8px;
      background: rgba(255, 255, 255, 0.9); border: 1px solid var(--border);
      color: var(--text); text-decoration: none; font-size: 15px;
      transition: all 0.2s ease;
    }
    .links a:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }
    h2 { font-size: 19px; font-weight: 600; margin-bottom: 12px; }
    .card p { color: var(--text-secondary); }
    /* 右侧两栏 各25% */
    .col-right { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 24px; }
    .col-right h2 { margin-bottom: 16px; }
    .photo-item {
      width: 100%;
      height: 170px;
      object-fit: cover;
      object-position: center;
      border-radius: 10px;
      display: block;
      margin-bottom: 6px;
      border: 1px solid var(--border);
      cursor: zoom-in;
      transition: transform 0.3s ease;
    }
    .photo-item:hover { transform: scale(1.03) rotate(-0.5deg); }
    .photo-cap {
      font-size: 12px; color: var(--text-muted);
      text-align: center; margin-bottom: 16px;
    }
    .placeholder {
      border: 1.5px dashed rgba(0, 0, 0, 0.2);
      border-radius: 10px;
      padding: 26px 12px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }
    .member {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .member:last-of-type { border-bottom: none; }
    .member-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 600; flex-shrink: 0;
    }
    .member img.member-avatar { object-fit: cover; }
    .member-info { min-width: 0; }
    .member-name { font-size: 15px; font-weight: 500; color: var(--text); }
    .member-desc { font-size: 13px; color: var(--text-muted); }
    .member a { color: var(--accent); text-decoration: none; font-size: 13px; }
    .hint { font-size: 12px; color: var(--text-muted); margin-top: 14px; }
    footer {
      text-align: center; padding: 24px 0 40px;
      color: rgba(255, 255, 255, 0.95);
      font-size: 14px;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.45);
      margin-bottom: 165px;
    }
    footer a { color: #fff; }
    /* ===== 答题门 ===== */
    #quiz-gate {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.6s ease, visibility 0.6s;
    }
    #quiz-gate.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .quiz-box { text-align: center; max-width: 420px; padding: 24px; }
    .quiz-dots { display: flex; justify-content: center; gap: 10px; margin-bottom: 28px; }
    .quiz-dots span {
      width: 12px; height: 12px; border-radius: 50%;
      background: rgba(0, 0, 0, 0.12); transition: all 0.4s ease;
    }
    .quiz-dots span.active { background: var(--accent); transform: scale(1.25); }
    .quiz-dots span.done { background: #22c55e; }
    .quiz-q {
      font-size: 22px; font-weight: 600; color: var(--text);
      margin-bottom: 8px; transition: all 0.35s ease;
    }
    .quiz-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
    .quiz-q.switch { opacity: 0; transform: translateY(14px); }
    .quiz-input {
      width: 100%; padding: 13px 18px; font-size: 17px;
      border: 2px solid rgba(0, 0, 0, 0.12); border-radius: 12px;
      outline: none; text-align: center; background: #fff;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
      font-family: inherit;
    }
    .quiz-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12); }
    .quiz-btn {
      margin-top: 16px; padding: 12px 42px; font-size: 16px; font-weight: 500;
      border: none; border-radius: 12px; cursor: pointer;
      background: var(--accent); color: #fff; font-family: inherit;
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .quiz-btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .quiz-btn:active { transform: scale(0.96); }
    .quiz-msg {
      height: 22px; margin-top: 14px; font-size: 14px;
      color: var(--text-muted); transition: opacity 0.3s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px); } 40% { transform: translateX(10px); }
      60% { transform: translateX(-7px); } 80% { transform: translateX(7px); }
    }
    .quiz-box.shake { animation: shake 0.45s ease; }
    .quiz-box.shake .quiz-input { border-color: #e24b4a; }
    /* ===== 彩蛋横幅 ===== */
    #banner-wrap {
      position: fixed; inset: 0; z-index: 200;
      display: none; align-items: center; justify-content: center;
      pointer-events: none;
    }
    #banner-wrap.show { display: flex; }
    #banner-img {
      max-width: 82vw; max-height: 62vh;
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      animation: banner-in 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    @keyframes banner-in {
      0% { transform: scale(0.2) rotate(-8deg); opacity: 0; }
      70% { transform: scale(1.08) rotate(2deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    @keyframes banner-out {
      0% { transform: scale(1) rotate(0deg); opacity: 1; }
      25% { transform: scale(1.12) rotate(-4deg); opacity: 1; }
      100% {
        transform: scale(0.05) translateY(-90vh) rotate(720deg);
        opacity: 0;
      }
    }
    #banner-img.out { animation: banner-out 1s cubic-bezier(0.5, -0.3, 0.8, 0.4) both; }
    /* ===== 阅读弹幕 ===== */
    #danmaku {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
      height: 178px; overflow: hidden; pointer-events: none;
      padding: 0 0 6px;
    }
    .dk-row { position: relative; height: 32px; margin-bottom: 16px; }
    .dk-track {
      display: flex; width: max-content;
      animation: dk-marquee var(--d) linear infinite;
      will-change: transform;
    }
    .dk-row:hover .dk-track, .dk-row.paused .dk-track { animation-play-state: paused; }
    .dk-half { display: flex; gap: 48px; padding-right: 48px; align-items: center; }
    .dk-item { pointer-events: auto; }
    .dk-pill {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 14px; color: var(--text); cursor: pointer;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.95), 0 0 8px rgba(255, 255, 255, 0.85);
      white-space: nowrap;
      transition: transform 0.25s ease, color 0.25s ease;
    }
    .dk-pill:hover { transform: scale(1.1) rotate(-0.5deg); color: var(--accent); }
    .dk-row.paused .dk-pill.on { color: var(--accent); }
    .dk-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dk-row.paused .dk-dot { animation: dk-pulse 1.2s ease infinite; }
    @keyframes dk-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.6); opacity: 0.55; }
    }
    @keyframes dk-marquee {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }
    #dk-source {
      height: 20px; margin-top: 2px;
      font-size: 11px; color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
      padding-left: 16px; opacity: 0; transition: opacity 0.3s ease;
    }
    /* ===== 照片折叠 ===== */
    .photo-head { display: flex; align-items: center; justify-content: space-between; }
    .photo-head h2 { margin-bottom: 0; }
    #photo-toggle {
      border: 1px solid var(--border); background: rgba(255, 255, 255, 0.9);
      border-radius: 999px; padding: 4px 14px; font-size: 12px;
      color: var(--text-secondary); cursor: pointer; font-family: inherit;
      transition: all 0.2s ease;
    }
    #photo-toggle:hover { color: var(--accent); border-color: var(--accent); }
    .photo-card.collapsed #photo-list { display: none; }
    /* ===== 照片灯箱 ===== */
    #lightbox {
      position: fixed; inset: 0; z-index: 300;
      background: rgba(0, 0, 0, 0.85);
      display: none; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px; cursor: zoom-out;
    }
    #lightbox.show { display: flex; }
    #lightbox img {
      max-width: 92vw; max-height: 84vh;
      border-radius: 10px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
      animation: banner-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    #lightbox .lb-cap { color: #fff; font-size: 14px; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }
    @media (max-width: 480px) {
      .quiz-q { font-size: 19px; }
      .quiz-box { padding: 16px; }
    }
    @media (max-width: 900px) {
      .layout { flex-direction: column; }
      .col-left, .col-right { width: 100%; }
      h1 { font-size: 30px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <!-- 左栏 50%：原有内容 -->
    <div class="col col-left">
      <div class="card">
        <div class="avatar">易</div>
        <h1>易礼安</h1>
        <p class="tagline">你劳nb！culr nb！</p>
      </div>
      <div class="card">
        <h2>关于我</h2>
        <p>斯多葛主义者，吾道不孤</p>
      </div>
      <div class="card">
        <h2>项目</h2>
        <p>Financial Book — 每天一本，bro.</p>
      </div>
    </div>

    <!-- 右栏 1：photo -->
    <div class="col col-right">
      <div class="card photo-card collapsed">
        <div class="photo-head">
          <h2>photo</h2>
          <button id="photo-toggle">展开照片 · 4 张 ▾</button>
        </div>
        <div id="photo-list">
        <img class="photo-item" src="photo1.jpg" alt="肥猫">
        <p class="photo-cap">沉思中的肥猫 · 淡定，是它教我的</p>
        <img class="photo-item" src="photo2.jpg" alt="佛香阁">
        <p class="photo-cap">佛香阁 · 屹立百年，风雨不动</p>
        <img class="photo-item" src="photo3.jpg" alt="梵高在午睡">
        <p class="photo-cap">梵高在午睡 · 麦垛里也有梦</p>
        <img class="photo-item" src="photo4.jpg" alt="晚霞">
        <p class="photo-cap">晚霞 · 每天的落幕都值得抬头看</p>
        <p class="hint">点击照片可查看完整大图</p>
        </div>
      </div>

      <!-- 右栏 2：智囊团 -->
      <div class="card">
        <h2>智囊团</h2>
        <!-- 加成员方法：复制下面一段 member，改名字和描述 -->
        <div class="member">
          <div class="member-avatar">A</div>
          <div class="member-info">
            <p class="member-name">成员 A</p>
            <p class="member-desc">一句话介绍</p>
          </div>
        </div>
        <div class="member">
          <div class="member-avatar">B</div>
          <div class="member-info">
            <p class="member-name">成员 B</p>
            <p class="member-desc">一句话介绍</p>
          </div>
        </div>
        <p class="hint">告诉我成员名字/文件，我来帮你填充</p>
      </div>
    </div>
  </div>
  <footer>
    © 2026 易礼安
    <br>
    <span id="stoic-quote" style="font-size:12px; opacity:0.85;"></span>
  </footer>

  <!-- 答题门 -->
  <div id="quiz-gate">
    <div class="quiz-box" id="quiz-box">
      <div class="quiz-dots">
        <span id="dot1" class="active"></span>
        <span id="dot2"></span>
      </div>
      <p class="quiz-q" id="quiz-q">第一关 · 我真名的缩写是？</p>
      <p class="quiz-sub" id="quiz-sub">小写字母 · 答对才能看到我的主页</p>
      <input class="quiz-input" id="quiz-input" type="text" autocomplete="off" spellcheck="false">
      <br>
      <button class="quiz-btn" id="quiz-btn">解锁</button>
      <p class="quiz-msg" id="quiz-msg">只有两关，别紧张</p>
    </div>
  </div>

  <!-- 彩蛋横幅 -->
  <div id="banner-wrap">
    <img id="banner-img" src="banner.webp" alt="恭喜你考了第一名">
  </div>

  <script>
    (function () {
      var ANSWERS = ["yxy", "阅读"];
      var WRONG_MSGS = [
        "不对哦～提示是不存在的，自己想",
        "错了，再想想，我不剧透",
        "差一点？不，是差很多",
        "这个答案它不认识路",
        "再来，反正我不累"
      ];
      var step = 0;
      var gate = document.getElementById("quiz-gate");
      var box = document.getElementById("quiz-box");
      var qEl = document.getElementById("quiz-q");
      var subEl = document.getElementById("quiz-sub");
      var input = document.getElementById("quiz-input");
      var btn = document.getElementById("quiz-btn");
      var msg = document.getElementById("quiz-msg");
      var dot1 = document.getElementById("dot1");
      var dot2 = document.getElementById("dot2");
      var bannerWrap = document.getElementById("banner-wrap");
      var bannerImg = document.getElementById("banner-img");
      var wrongCount = 0;

      function submit() {
        var val = (input.value || "").trim().toLowerCase();
        if (!val) return;
        if (val === ANSWERS[step]) {
          step++;
          if (step === 1) {
            dot1.className = "done";
            dot2.className = "active";
            qEl.classList.add("switch");
            subEl.classList.add("switch");
            msg.style.opacity = "0";
            setTimeout(function () {
              qEl.textContent = "第二关 · 我目前最大的爱好是？";
              subEl.textContent = "两个字 · 每天都在做的那种";
              input.value = "";
              qEl.classList.remove("switch");
              subEl.classList.remove("switch");
              msg.textContent = "最后一关，冲";
              msg.style.opacity = "1";
            }, 380);
          } else {
            dot2.className = "done";
            msg.textContent = "全对！恭喜通关";
            openGate();
          }
        } else {
          wrongCount++;
          box.classList.remove("shake");
          void box.offsetWidth;
          box.classList.add("shake");
          msg.textContent = WRONG_MSGS[Math.min(wrongCount - 1, WRONG_MSGS.length - 1)];
          input.value = "";
          input.focus();
        }
      }

      function openGate() {
        try { localStorage.setItem("yxy_quiz_passed", "1"); } catch (e) {}
        setTimeout(function () {
          gate.classList.add("hidden");
          bannerWrap.classList.add("show");
          setTimeout(function () {
            bannerImg.classList.add("out");
          }, 3000);
          setTimeout(function () {
            bannerWrap.classList.remove("show");
            bannerImg.classList.remove("out");
          }, 4050);
        }, 700);
      }

      btn.addEventListener("click", submit);

      /* 答过一次就记住：通关后 localStorage 永久记录，下次直接放行 */
      try {
        if (localStorage.getItem("yxy_quiz_passed") === "1") {
          gate.style.transition = "none";
          gate.classList.add("hidden");
        }
      } catch (e) { /* 浏览器隐私模式等场景静默跳过 */ }
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") submit();
      });
      setTimeout(function () { input.focus(); }, 300);

      /* 标签页彩蛋：切走显示"咦，人呢？"，切回来恢复 */
      var baseTitle = document.title;
      document.addEventListener("visibilitychange", function () {
        document.title = document.hidden ? "咦，人呢？—— 易礼安" : baseTitle;
      });

      /* 每天换一句斯多葛语录，按日期轮换 */
      var QUOTES = [
        "你所控制的是你的心灵，其余皆非你所能主宰。 —— 爱比克泰德",
        "阻碍行动的，也可以推动行动；阻碍道路的，也可以成为道路。 —— 马可·奥勒留",
        "我们受苦，往往更多是在想象中，而非现实中。 —— 塞涅卡",
        "好运不过是另一个名字：准备遇上了机会。 —— 爱比克泰德",
        "不要为整场人生担忧，只问当下这一步该怎么走。 —— 马可·奥勒留",
        "失去的只是你原本就拥有的东西。 —— 爱比克泰德",
        "苦难让人出名，是在苦难中保持稳定的人。 —— 塞涅卡"
      ];
      var qEl2 = document.getElementById("stoic-quote");
      if (qEl2) qEl2.textContent = QUOTES[new Date().getDate() % QUOTES.length];
    })();

    /* ===== 阅读弹幕：三行循环，整行联动暂停，出处悬浮显示 ===== */
    (function () {
      var QUOTES = [
        { t: "我从未想过，要撕开面目，要透过人的表象去触摸他们的内心。", s: "《蛇结》", c: "#22c55e" },
        { t: "世界以悠长的节奏向我叹气，带给我永生不死者拥有的淡漠与宁静。", s: "《在我身上有一个不可战胜的夏天》", c: "#d97706" },
        { t: "在挤满了人类之恶的潘多拉之盒中，希腊人把希望放到最后一个拿出。", s: "《在我身上有一个不可战胜的夏天》", c: "#8b5cf6" },
        { t: "这正在行进的欢乐，如尘世间的朝圣者般淡漠与专注，我应当一步一步地跟随它。", s: "《在我身上有一个不可战胜的夏天》", c: "#e24b4a" },
        { t: "发现别人的错误总比发现自己的错误更容易。", s: "《思考，快与慢》", c: "#22c55e" },
        { t: "当你对执行一个任务越来越熟练时，需要付出的努力程度就会降低。", s: "《思考，快与慢》", c: "#d97706" },
        { t: "你觉得自己很了解自己，但其实你错了。", s: "《思考，快与慢》", c: "#8b5cf6" },
        { t: "你的直觉会产生极端预测，而你也很容易对这种极端信心满满。", s: "《思考，快与慢》", c: "#22c55e" },
        { t: "他们貌似又对自己的无知一无所知。", s: "《思考，快与慢》", c: "#22c55e" },
        { t: "人们在收益状态下更倾向于规避损失，在亏损状态下更倾向于承担风险。", s: "《思考，快与慢》", c: "#d97706" },
        { t: "人们极度厌恶为得到其他好处而以增加风险为代价的交易。", s: "《思考，快与慢》", c: "#22c55e" },
        { t: "在获得时，偏向确定的事；在损失时，偏向赌一把。", s: "《思考，快与慢》", c: "#d97706" },
        { t: "聚焦错觉的本质是眼见即为事实。", s: "《思考，快与慢》", c: "#22c55e" }
      ];
      var box = document.createElement("div");
      box.id = "danmaku";
      var source = document.createElement("div");
      source.id = "dk-source";
      document.body.appendChild(box);
      document.body.appendChild(source);
      var speeds = [46, 60, 52];
      var rows = [[], [], []];
      QUOTES.forEach(function (q, i) { rows[i % 3].push(q); });
      rows.forEach(function (items, r) {
        var row = document.createElement("div");
        row.className = "dk-row";
        var track = document.createElement("div");
        track.className = "dk-track";
        track.style.setProperty("--d", speeds[r] + "s");
        for (var half = 0; half < 2; half++) {
          var hd = document.createElement("div");
          hd.className = "dk-half";
          items.forEach(function (q, i) {
            var el = document.createElement("span");
            el.className = "dk-item";
            var pill = document.createElement("span");
            pill.className = "dk-pill";
            var dot = document.createElement("i");
            dot.className = "dk-dot";
            dot.style.background = q.c;
            var text = document.createElement("span");
            text.textContent = q.t;
            pill.appendChild(dot);
            pill.appendChild(text);
            el.appendChild(pill);
            el.addEventListener("mouseenter", function () {
              source.textContent = "—— " + q.s;
              source.style.opacity = "1";
            });
            el.addEventListener("click", function (e) {
              e.stopPropagation();
              var on = row.classList.toggle("paused");
              el.classList.toggle("on", on);
              if (on) {
                source.textContent = "—— " + q.s + "（该行已暂停，再点一下继续）";
                source.style.opacity = "1";
              } else {
                source.style.opacity = "0";
              }
            });
            hd.appendChild(el);
          });
          track.appendChild(hd);
        }
        row.appendChild(track);
        row.addEventListener("mouseleave", function () {
          if (!row.classList.contains("paused")) source.style.opacity = "0";
        });
        box.appendChild(row);
      });
      box.appendChild(source);
    })();

    /* ===== photo 折叠按钮 ===== */
    (function () {
      var card = document.querySelector(".photo-card");
      var btn = document.getElementById("photo-toggle");
      if (!card || !btn) return;
      btn.addEventListener("click", function () {
        var collapsed = card.classList.toggle("collapsed");
        btn.textContent = collapsed ? "展开照片 · 4 张 ▾" : "收起照片 ▴";
      });
    })();

    /* ===== 照片灯箱：点击查看完整大图 ===== */
    (function () {
      var lb = document.createElement("div");
      lb.id = "lightbox";
      var img = document.createElement("img");
      var cap = document.createElement("p");
      cap.className = "lb-cap";
      lb.appendChild(img);
      lb.appendChild(cap);
      document.body.appendChild(lb);
      document.querySelectorAll(".photo-item").forEach(function (p) {
        p.addEventListener("click", function () {
          img.src = p.src;
          var pc = p.nextElementSibling;
          cap.textContent = pc ? pc.textContent.replace(/^.*· /, "") : "";
          lb.classList.add("show");
        });
      });
      lb.addEventListener("click", function () { lb.classList.remove("show"); });
    })();
  </script>
</body>
</html>
